<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>DCG fix test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#000}#unity-canvas{display:block}</style>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">DCG Project</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl-test.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl-test.data",
        frameworkUrl: buildUrl + "/webgl-test.framework.js",
        codeUrl: buildUrl + "/webgl-test.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "DCG Project",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
    <div id="diag-probe" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)"></div>
    <div id="diag" style="position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;background:rgba(0,0,0,.7);color:#0f0;font:11px/1.3 monospace;padding:4px 6px;white-space:pre"></div>
    <div id="diag-dot" style="position:fixed;z-index:10000;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:red;display:none"></div>
    <script>
      (function(){
        var out=document.getElementById('diag'), dot=document.getElementById('diag-dot'), probe=document.getElementById('diag-probe');
        var last='', n=0;
        function r(v){return Math.round(v*10)/10;}
        function show(){
          var c=document.querySelector('#unity-canvas'), b=c.getBoundingClientRect(), vv=window.visualViewport, ps=getComputedStyle(probe);
          out.textContent=
            'fix3 #'+(++n)+' standalone='+(navigator.standalone)+' dm='+matchMedia('(display-mode: standalone)').matches+'\n'+
            'inner '+innerWidth+'x'+innerHeight+' scrollY='+scrollY+' dpr='+devicePixelRatio+'\n'+
            'vv '+(vv?r(vv.width)+'x'+r(vv.height)+' offTop='+r(vv.offsetTop)+' pageTop='+r(vv.pageTop):'none')+'\n'+
            'screen '+screen.width+'x'+screen.height+' angle='+(screen.orientation?screen.orientation.angle:window.orientation)+'\n'+
            'docEl '+document.documentElement.clientWidth+'x'+document.documentElement.clientHeight+'\n'+
            'canvas buf '+c.width+'x'+c.height+' rect top='+r(b.top)+' left='+r(b.left)+' '+r(b.width)+'x'+r(b.height)+'\n'+
            'safe T'+ps.paddingTop+' B'+ps.paddingBottom+' L'+ps.paddingLeft+' R'+ps.paddingRight+'\n'+
            last;
        }
        document.addEventListener('touchstart',function(e){
          var t=e.touches[0]; if(!t) return;
          dot.style.left=t.clientX+'px'; dot.style.top=t.clientY+'px'; dot.style.display='block';
          var b=document.querySelector('#unity-canvas').getBoundingClientRect();
          last='touch client '+r(t.clientX)+','+r(t.clientY)+' page '+r(t.pageX)+','+r(t.pageY)+' screen '+r(t.screenX)+','+r(t.screenY)+' inCanvasY='+r(t.clientY-b.top);
          show();
        },{passive:true,capture:true});
        ['resize','orientationchange','scroll'].forEach(function(ev){window.addEventListener(ev,function(){setTimeout(show,300);});});
        if(window.visualViewport){visualViewport.addEventListener('resize',show);visualViewport.addEventListener('scroll',show);}
        function reset(){ if(window.scrollX||window.scrollY||(window.visualViewport&&visualViewport.offsetTop)) window.scrollTo(0,0); }
        function resetSoon(){ [0,100,300,600,1000].forEach(function(d){setTimeout(function(){reset();show();},d);}); }
        window.addEventListener('orientationchange',resetSoon); window.addEventListener('resize',resetSoon);
        if(window.visualViewport) visualViewport.addEventListener('resize',resetSoon);
        setInterval(show,2000); show();
      })();
    </script>
  </body>
</html>
